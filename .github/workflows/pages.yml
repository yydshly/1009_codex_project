name: Publish GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      # 构建子项目：在此按各项目文档加入安装与构建步骤。
      # 纯静态 HTML 项目无需构建，pagesDir 指向包含 index.html 的目录。
      - name: 构建 Motion Video Kit 完整研究与演示
        working-directory: projects/001-motion-video-kit/web
        run: |
          npm ci
          npm run build
          npm run verify
      - name: 构建与检查 Agenvo 完整研究页
        working-directory: projects/016-agenvo/web
        run: |
          npm run build
          npm run check
      - name: 构建与检查 Alook 完整研究页
        working-directory: projects/017-alook/web
        run: |
          npm run build
          npm run check
      - name: 构建与检查抖音内容工作流研究页
        working-directory: projects/018-ah-douyin-clean-downloader/web
        run: |
          npm run build
          npm run check
      - run: npm run check
      - run: npm run pages:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
