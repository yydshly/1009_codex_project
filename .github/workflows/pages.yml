name: Publish GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      # 构建子项目：在此按各项目文档加入安装与构建步骤。
      # 纯静态 HTML 项目无需构建，pagesDir 指向包含 index.html 的目录。
      - name: 构建 Motion Video Kit 完整研究与演示
        working-directory: projects/001-motion-video-kit/web
        run: |
          npm ci
          npm run build
          npm run verify
      - name: 构建 Dioramas 完整研究与场景实验
        working-directory: projects/002-dioramas/web
        run: |
          npm ci
          npm run build
      - name: 构建与检查 Oil UI 完整研究与工作台
        run: |
          node projects/003-oil-ui/scripts/build.mjs
          node projects/003-oil-ui/scripts/check-web.mjs
          node --test projects/003-oil-ui/tests/model.test.mjs
      - name: 构建 Dvor 完整研究与社区导览实验
        working-directory: projects/004-dvor/web
        run: |
          npm ci
          npm run build
      - name: 构建与检查 Agenvo 完整研究页
        working-directory: projects/016-agenvo/web
        run: |
          npm run build
          npm run check
      - name: 构建与检查 Alook 完整研究页
        working-directory: projects/017-alook/web
        run: |
          npm run build
          npm run check
      - name: 构建与检查抖音内容工作流研究页
        working-directory: projects/018-ah-douyin-clean-downloader/web
        run: |
          npm run build
          npm run check
      - name: 构建与检查 Astra 作品合集完整研究页
        working-directory: projects/005-awesome-gpt-6-astra/web
        run: |
          npm run build
          npm run check
      - name: 构建与检查 Seiso 完整研究页
        working-directory: projects/007-seiso/web
        run: |
          npm run build
          npm run check
      - name: 检查 BeefTV 完整研究与能力展示
        run: npm run check --prefix projects/006-beeftv/web
      - name: 构建与检查 LibTV Skills 完整研究页
        working-directory: projects/019-libtv-skills/web
        run: |
          npm run build
          npm run check
      - name: 构建 Realtime Solar System 完整研究与交互演示
        working-directory: projects/008-openai-realtime-solar-system/web
        run: |
          npm ci
          npm run check
          npm run build
      - name: 构建与检查 Functional Emotions 代码绘画与音乐 MV 研究页
        working-directory: projects/009-functional-emotions-video/web
        run: |
          npm run build
          npm run check
      - run: npm run check
      - run: npm run pages:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
